<!DOCTYPE html>
<html>
<head>
    <title>SRE Incident Self-Help Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles2.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SRE Incident Self-Help Portal</h1>
            <p class="subtitle">Get AI-powered insights from historical incidents</p>
        </div>

        <div class="search-section">
            <textarea 
                id="incidentDescription" 
                placeholder="Describe the incident you're experiencing..."
                rows="4"
                class="form-control"
            ></textarea>
            <button onclick="analyzeIncident()" class="btn btn-primary">Analyze Incident</button>
        </div>

        <div id="loadingSpinner" class="spinner-border text-primary d-none" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>

        <div id="resultsSection" class="results-section d-none">
            <div class="result-card">
                <h3>Root Cause Analysis</h3>
                <div id="rootCauseList" class="content-list"></div>
            </div>

            <div class="result-card">
                <h3>Resolution Steps</h3>
                <div id="resolutionList" class="content-list"></div>
            </div>

            <div class="result-card">
                <h3>Preventive Measures</h3>
                <div id="preventiveList" class="content-list"></div>
            </div>

            <div class="similar-incidents">
                <h3>Similar Historical Incidents</h3>
                <div id="similarIncidents" class="incident-badges"></div>
            </div>
        </div>
    </div>

    <!-- Modal for incident details -->
    <div class="modal fade" id="incidentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Incident Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalContent">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script2.js"></script>
</body>
</html>
