<!DOCTYPE html>
<html>
<head>
    <title>SRE Incident Response Bot</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <h1>SRE Incident Response Bot</h1>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <textarea 
                    id="incidentDescription" 
                    placeholder="Describe the incident you're experiencing..."
                ></textarea>
                <button onclick="submitIncident()">Submit</button>
            </div>
        </div>
        <div class="reference-container">
            <h2>Reference Incidents</h2>
            <div id="referenceIncidents"></div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
